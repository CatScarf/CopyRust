[package]
name = "copyrust-python"
version = "0.1.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/CatScarf/CopyRust"
description = "Typed Python bindings for CopyRust"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
copyrust = { version = "0.1.1", path = ".." }
copyrust-cli = { version = "0.1.1", path = "../cli" }
pyo3 = { version = "=0.29.3", features = ["abi3-py39"] }
serde_json = "1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
