[package]
name = "copyrust"
version = "0.1.3"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Parallel, content-aware batch file copying with structured progress"
repository = "https://github.com/CatScarf/CopyRust"
readme = "README.md"
include = ["src/**", "Cargo.toml", "README.md", "LICENSE"]

[workspace]
members = ["cli", "python"]
default-members = [".", "cli"]
resolver = "3"

[dependencies]
anyhow = "1"
blake3 = "1.8"
filetime = "0.2"
globset = "0.4"
rayon = "1.11"
same-file = "1"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
walkdir = "2.5"
twox-hash = { version = "2.1", default-features = false, features = ["std", "xxhash64", "xxhash3_64"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Wdk_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_Security"] }

[dev-dependencies]
serde_json = "1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
