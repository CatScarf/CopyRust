[package]
name = "copyrust"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Parallel, content-aware batch file copying with structured progress"
repository = "https://github.com/CatScarf/CopyRust"
readme = "README.md"
include = ["src/**", "Cargo.toml", "README.md", "LICENSE"]

[workspace]
members = ["cli", "python"]
default-members = [".", "cli"]
resolver = "3"

[dependencies]
anyhow = "1"
blake3 = "1.8"
filetime = "0.2"
globset = "0.4"
rayon = "1.11"
same-file = "1"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
walkdir = "2.5"

[dev-dependencies]
serde_json = "1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
