[package]
name = "copyrust-cli"
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Content-aware parallel copying from the command line"
repository = "https://github.com/CatScarf/CopyRust"
readme = "README.md"

[[bin]]
name = "copyrust"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
copyrust = { version = "0.1.2", path = ".." }
ctrlc = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
